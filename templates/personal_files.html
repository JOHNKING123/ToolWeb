{{define "personal_files"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人文件管理 - 个人工具</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="/tools/static/css/style.css">
    <style>
        :root { --pf-blue:#315fca; --pf-text:#232b3a; --pf-muted:#727c8e; --pf-border:#e3e7ee; }
        body { background:#f5f7fb; color:var(--pf-text); }
        .file-shell { max-width:1280px; margin:28px auto 70px; padding:0 20px; }
        .file-titlebar { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; }
        .file-titlebar h1 { display:flex; align-items:center; gap:11px; margin:0 0 6px; font-size:29px; }
        .file-titlebar p { margin:0; color:var(--pf-muted); }
        .back-hub { display:inline-flex; align-items:center; gap:6px; color:var(--pf-blue); text-decoration:none; font-weight:600; white-space:nowrap; }
        .drive { overflow:hidden; background:#fff; border:1px solid var(--pf-border); border-radius:16px; box-shadow:0 9px 28px rgba(32,45,75,.07); }
        .drive-toolbar { display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--pf-border); flex-wrap:wrap; }
        .drive-btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:38px; padding:0 13px; border:1px solid #d7dde8; border-radius:9px; color:#354052; background:#fff; cursor:pointer; font:inherit; transition:.15s; }
        .drive-btn:hover { color:var(--pf-blue); border-color:#9bb4e9; background:#f6f9ff; }
        .drive-btn.primary { color:#fff; border-color:var(--pf-blue); background:var(--pf-blue); }
        .drive-btn.primary:hover { color:#fff; background:#244da9; }
        .drive-btn.danger:hover { color:#c93636; border-color:#e5a3a3; background:#fff7f7; }
        .drive-btn i { font-size:19px; }
        .search-wrap { position:relative; margin-left:auto; min-width:230px; }
        .search-wrap i { position:absolute; top:9px; left:11px; color:#8b94a5; font-size:20px; }
        .search-wrap input { box-sizing:border-box; width:100%; height:38px; padding:0 12px 0 38px; border:1px solid #d7dde8; border-radius:9px; outline:none; }
        .search-wrap input:focus { border-color:#7d9cdf; box-shadow:0 0 0 3px rgba(49,95,202,.1); }
        .breadcrumbs { display:flex; align-items:center; min-height:46px; padding:0 18px; border-bottom:1px solid var(--pf-border); color:var(--pf-muted); overflow-x:auto; }
        .crumb { padding:5px 4px; color:#586579; background:none; border:0; cursor:pointer; white-space:nowrap; }
        .crumb:hover, .crumb.current { color:var(--pf-blue); }
        .crumb-separator { padding:0 2px; color:#b0b6c1; }
        .drop-zone { margin:16px 18px 0; padding:13px; color:#68748a; border:1px dashed #b7c5e2; border-radius:10px; background:#f8faff; text-align:center; transition:.15s; }
        .drop-zone.active { color:var(--pf-blue); border-color:var(--pf-blue); background:#edf3ff; }
        .file-table { width:100%; border-collapse:collapse; table-layout:fixed; }
        .file-table th { padding:12px 16px; color:#7d8696; background:#fafbfc; border-bottom:1px solid var(--pf-border); font-size:13px; font-weight:600; text-align:left; }
        .file-table td { padding:13px 16px; border-bottom:1px solid #edf0f4; vertical-align:middle; }
        .file-table tbody tr:hover { background:#f8faff; }
        .file-table tbody tr:last-child td { border-bottom:0; }
        .file-name { display:flex; align-items:center; gap:11px; min-width:0; }
        .file-name .material-icons { flex:0 0 auto; color:#e6a728; font-size:29px; }
        .file-name .image-icon { color:#4d84d9; }
        .name-button { overflow:hidden; padding:0; color:#303a4b; background:none; border:0; cursor:pointer; font:inherit; font-weight:600; text-align:left; text-overflow:ellipsis; white-space:nowrap; }
        .name-button:hover { color:var(--pf-blue); }
        .muted { color:var(--pf-muted); font-size:14px; }
        .actions { display:flex; justify-content:flex-end; gap:4px; }
        .icon-btn { display:grid; place-items:center; width:34px; height:34px; color:#667185; background:transparent; border:0; border-radius:7px; cursor:pointer; }
        .icon-btn:hover { color:var(--pf-blue); background:#eaf0ff; }
        .icon-btn.delete:hover { color:#c93636; background:#fff0f0; }
        .icon-btn i { font-size:19px; }
        .empty-state { display:none; padding:70px 20px; color:#7b8495; text-align:center; }
        .empty-state i { display:block; margin-bottom:10px; color:#c0c8d5; font-size:58px; }
        .loading { padding:55px; color:#758197; text-align:center; }
        .preview-modal { position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center; padding:30px; background:rgba(15,20,30,.78); }
        .preview-modal.open { display:flex; }
        .preview-modal img { max-width:min(1100px, 92vw); max-height:86vh; border-radius:9px; box-shadow:0 20px 70px rgba(0,0,0,.4); }
        .preview-close { position:absolute; top:20px; right:24px; display:grid; place-items:center; width:44px; height:44px; color:#fff; background:rgba(0,0,0,.35); border:0; border-radius:50%; cursor:pointer; }
        .toast { position:fixed; right:22px; bottom:24px; z-index:1200; max-width:360px; padding:12px 16px; color:#fff; background:#263248; border-radius:9px; box-shadow:0 8px 28px rgba(0,0,0,.22); opacity:0; transform:translateY(14px); pointer-events:none; transition:.2s; }
        .toast.show { opacity:1; transform:translateY(0); }
        .toast.error { background:#b63737; }
        @media (max-width:760px) {
            .file-shell { margin-top:18px; padding:0 10px; }
            .file-titlebar { align-items:flex-start; }
            .drive-toolbar { padding:12px; }
            .search-wrap { order:5; width:100%; margin-left:0; }
            .drop-zone { margin:12px 12px 0; }
            .file-table th:nth-child(2), .file-table td:nth-child(2), .file-table th:nth-child(3), .file-table td:nth-child(3) { display:none; }
            .file-table th, .file-table td { padding:12px; }
            .file-table col.name { width:58% !important; }
            .file-table col.actions-col { width:42% !important; }
        }
    </style>
</head>
<body>
    {{template "nav" .}}
    <main class="file-shell">
        <div class="file-titlebar">
            <div>
                <h1><i class="material-icons" style="color:#315fca">folder_managed</i>个人文件管理</h1>
                <p>上传、整理和分享你的个人文件。</p>
            </div>
            <a class="back-hub" href="/tools/personal"><i class="material-icons">arrow_back</i>个人工具</a>
        </div>

        <section class="drive">
            <div class="drive-toolbar">
                <button class="drive-btn primary" id="uploadButton"><i class="material-icons">upload</i>上传文件</button>
                <button class="drive-btn" id="newFolderButton"><i class="material-icons">create_new_folder</i>新建文件夹</button>
                <button class="drive-btn" id="refreshButton" title="刷新"><i class="material-icons">refresh</i></button>
                <input id="fileInput" type="file" multiple hidden>
                <div class="search-wrap">
                    <i class="material-icons">search</i>
                    <input id="searchInput" type="search" placeholder="搜索当前目录">
                </div>
            </div>
            <div class="breadcrumbs" id="breadcrumbs"></div>
            <div class="drop-zone" id="dropZone">拖拽文件到这里，或点击“上传文件”（单文件最大 50 MB）</div>
            <div id="loading" class="loading">正在加载文件...</div>
            <div id="fileArea" hidden>
                <table class="file-table">
                    <colgroup><col class="name" style="width:48%"><col style="width:14%"><col style="width:20%"><col class="actions-col" style="width:18%"></colgroup>
                    <thead><tr><th>名称</th><th>大小</th><th>修改时间</th><th style="text-align:right">操作</th></tr></thead>
                    <tbody id="fileList"></tbody>
                </table>
                <div class="empty-state" id="emptyState"><i class="material-icons">folder_open</i><div>当前目录还没有文件</div></div>
            </div>
        </section>
    </main>

    <div class="preview-modal" id="previewModal" role="dialog" aria-modal="true" aria-label="图片预览">
        <button class="preview-close" id="previewClose" title="关闭"><i class="material-icons">close</i></button>
        <img id="previewImage" alt="图片预览">
    </div>
    <div class="toast" id="toast"></div>

    <script>
    (() => {
        const apiBase = '/tools/personal/files/api';
        let currentPath = '';
        let searchTimer = null;
        const fileList = document.getElementById('fileList');
        const fileArea = document.getElementById('fileArea');
        const emptyState = document.getElementById('emptyState');
        const loading = document.getElementById('loading');
        const fileInput = document.getElementById('fileInput');
        const searchInput = document.getElementById('searchInput');
        const dropZone = document.getElementById('dropZone');
        const previewModal = document.getElementById('previewModal');
        const previewImage = document.getElementById('previewImage');
        const toast = document.getElementById('toast');

        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => toast.className = 'toast', 2600);
        }

        async function request(url, options = {}) {
            const response = await fetch(url, options);
            const data = await response.json().catch(() => ({error: '服务器返回了无效响应'}));
            if (!response.ok || data.success === false) throw new Error(data.error || '操作失败');
            return data;
        }

        function formatSize(size) {
            if (size === 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            const index = Math.min(Math.floor(Math.log(size) / Math.log(1024)), units.length - 1);
            return (size / Math.pow(1024, index)).toFixed(index === 0 ? 0 : 1) + ' ' + units[index];
        }

        function contentURL(itemPath, download = false) {
            return '/tools/personal/files/content?path=' + encodeURIComponent(itemPath) + (download ? '&download=1' : '');
        }

        function iconButton(icon, title, action, extraClass = '') {
            const button = document.createElement('button');
            button.className = 'icon-btn ' + extraClass;
            button.title = title;
            const iconElement = document.createElement('i');
            iconElement.className = 'material-icons';
            iconElement.textContent = icon;
            button.appendChild(iconElement);
            button.addEventListener('click', action);
            return button;
        }

        function renderBreadcrumbs() {
            const box = document.getElementById('breadcrumbs');
            box.replaceChildren();
            const parts = currentPath ? currentPath.split('/') : [];
            const allParts = [{name: '我的文件', path: ''}];
            let accumulated = '';
            parts.forEach(part => {
                accumulated = accumulated ? accumulated + '/' + part : part;
                allParts.push({name: part, path: accumulated});
            });
            allParts.forEach((part, index) => {
                if (index > 0) {
                    const separator = document.createElement('span');
                    separator.className = 'crumb-separator';
                    separator.textContent = '›';
                    box.appendChild(separator);
                }
                const button = document.createElement('button');
                button.className = 'crumb' + (index === allParts.length - 1 ? ' current' : '');
                button.textContent = part.name;
                button.addEventListener('click', () => openFolder(part.path));
                box.appendChild(button);
            });
        }

        function renderItems(items) {
            fileList.replaceChildren();
            emptyState.style.display = items.length ? 'none' : 'block';
            items.forEach(item => {
                const row = document.createElement('tr');
                const nameCell = document.createElement('td');
                const nameWrap = document.createElement('div');
                nameWrap.className = 'file-name';
                const icon = document.createElement('i');
                icon.className = 'material-icons' + (item.previewable ? ' image-icon' : '');
                icon.textContent = item.isDir ? 'folder' : (item.previewable ? 'image' : 'description');
                const nameButton = document.createElement('button');
                nameButton.className = 'name-button';
                nameButton.textContent = item.name;
                nameButton.title = item.name;
                nameButton.addEventListener('click', () => item.isDir ? openFolder(item.path) : (item.previewable ? preview(item) : download(item)));
                nameWrap.append(icon, nameButton);
                nameCell.appendChild(nameWrap);

                const sizeCell = document.createElement('td');
                sizeCell.className = 'muted';
                sizeCell.textContent = item.isDir ? '—' : formatSize(item.size);
                const timeCell = document.createElement('td');
                timeCell.className = 'muted';
                timeCell.textContent = new Date(item.modifiedAt).toLocaleString('zh-CN', {hour12:false});
                const actionCell = document.createElement('td');
                const actions = document.createElement('div');
                actions.className = 'actions';
                if (item.previewable) actions.appendChild(iconButton('visibility', '预览', () => preview(item)));
                if (!item.isDir) {
                    actions.appendChild(iconButton('download', '下载', () => download(item)));
                    actions.appendChild(iconButton('link', '复制分享链接', () => share(item)));
                }
                actions.appendChild(iconButton('drive_file_rename_outline', '重命名', () => renameItem(item)));
                actions.appendChild(iconButton('delete_outline', '删除', () => deleteItem(item), 'delete'));
                actionCell.appendChild(actions);
                row.append(nameCell, sizeCell, timeCell, actionCell);
                fileList.appendChild(row);
            });
        }

        async function loadFiles() {
            loading.hidden = false;
            fileArea.hidden = true;
            try {
                const query = new URLSearchParams({path: currentPath, q: searchInput.value.trim()});
                const data = await request(apiBase + '/list?' + query.toString());
                currentPath = data.path || '';
                renderBreadcrumbs();
                renderItems(data.items || []);
                fileArea.hidden = false;
            } catch (error) {
                showToast(error.message, true);
            } finally {
                loading.hidden = true;
            }
        }

        function openFolder(path) {
            currentPath = path;
            searchInput.value = '';
            loadFiles();
        }

        async function upload(files) {
            if (!files || !files.length) return;
            const form = new FormData();
            form.append('path', currentPath);
            Array.from(files).forEach(file => form.append('files', file));
            try {
                showToast('正在上传 ' + files.length + ' 个文件...');
                const data = await request(apiBase + '/upload', {method:'POST', body:form});
                showToast('已上传 ' + data.uploaded.length + ' 个文件');
                await loadFiles();
            } catch (error) {
                showToast(error.message, true);
            } finally {
                fileInput.value = '';
            }
        }

        async function createFolder() {
            const name = prompt('请输入文件夹名称');
            if (!name) return;
            try {
                await request(apiBase + '/folder', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path:currentPath, name})});
                showToast('文件夹已创建');
                await loadFiles();
            } catch (error) { showToast(error.message, true); }
        }

        function preview(item) {
            previewImage.src = contentURL(item.path);
            previewImage.alt = item.name;
            previewModal.classList.add('open');
        }

        function closePreview() {
            previewModal.classList.remove('open');
            previewImage.removeAttribute('src');
        }

        function download(item) {
            const anchor = document.createElement('a');
            anchor.href = contentURL(item.path, true);
            anchor.download = item.name;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
        }

        async function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
            const input = document.createElement('textarea');
            input.value = text;
            input.style.position = 'fixed';
            input.style.opacity = '0';
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            input.remove();
        }

        async function share(item) {
            try {
                const data = await request(apiBase + '/share', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path:item.path})});
                await copyText(data.url);
                showToast('分享链接已复制');
            } catch (error) { showToast(error.message, true); }
        }

        async function renameItem(item) {
            const name = prompt('请输入新名称', item.name);
            if (!name || name === item.name) return;
            try {
                await request(apiBase + '/rename', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path:item.path, name})});
                showToast('重命名成功');
                await loadFiles();
            } catch (error) { showToast(error.message, true); }
        }

        async function deleteItem(item) {
            if (!confirm('确定删除“' + item.name + '”吗？' + (item.isDir ? ' 文件夹内的内容也会被删除。' : ''))) return;
            try {
                await request(apiBase + '/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path:item.path})});
                showToast('已删除');
                await loadFiles();
            } catch (error) { showToast(error.message, true); }
        }

        document.getElementById('uploadButton').addEventListener('click', () => fileInput.click());
        document.getElementById('newFolderButton').addEventListener('click', createFolder);
        document.getElementById('refreshButton').addEventListener('click', loadFiles);
        fileInput.addEventListener('change', () => upload(fileInput.files));
        searchInput.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadFiles, 250); });
        ['dragenter', 'dragover'].forEach(event => dropZone.addEventListener(event, e => { e.preventDefault(); dropZone.classList.add('active'); }));
        ['dragleave', 'drop'].forEach(event => dropZone.addEventListener(event, e => { e.preventDefault(); dropZone.classList.remove('active'); }));
        dropZone.addEventListener('drop', event => upload(event.dataTransfer.files));
        dropZone.addEventListener('click', () => fileInput.click());
        document.getElementById('previewClose').addEventListener('click', closePreview);
        previewModal.addEventListener('click', event => { if (event.target === previewModal) closePreview(); });
        document.addEventListener('keydown', event => { if (event.key === 'Escape') closePreview(); });
        loadFiles();
    })();
    </script>
</body>
</html>
{{end}}
