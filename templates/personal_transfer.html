{{define "personal_transfer"}}
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>手机电脑互传 - 个人工具</title><link rel="stylesheet" href="/tools/static/css/style.css"><link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"><link rel="stylesheet" href="/tools/static/css/personal-utilities.css"></head>
<body data-tool="transfer">{{template "nav" .}}<main class="utility"><a href="/tools/personal">← 个人工具</a><h1>手机电脑互传</h1><div id="status" role="status" aria-live="polite"></div><p>手机扫码打开后，使用 admin 账号登录。两端都能上传和下载，文件列表每 10 秒自动更新。</p><section class="panel connect"><img id="qr" class="qr" alt="手机扫码打开互传页面" hidden><div><h2>连接另一台设备</h2><p>本地运行时，两台设备需连接同一 Wi-Fi。若有多个地址，可切换后重试；已部署的网站可直接使用网站地址。</p><input id="address" list="addresses" aria-label="另一台设备的访问地址" placeholder="http://192.168.1.100:8080/tools/personal/transfer"><datalist id="addresses"></datalist><div class="row"><button id="generate">生成二维码</button><button id="copyLink">复制地址</button></div></div></section><section class="panel"><div class="row"><h2>收发文件</h2><button id="upload" class="primary">上传文件</button><button id="refresh">刷新</button></div><p>单文件最大 50 MB。文件保存在个人文件管理的“手机电脑互传”文件夹，关闭页面后仍保留。</p><input type="file" id="files" multiple hidden><div id="drop">拖放文件到这里，或点此选择文件</div><div id="items"></div></section></main><script src="/tools/static/js/personal-utilities.js"></script></body></html>
{{end}}
