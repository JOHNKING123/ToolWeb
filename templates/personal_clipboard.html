{{define "personal_clipboard"}}
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>个人剪贴板 - 个人工具</title><link rel="stylesheet" href="/tools/static/css/style.css"><link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"><link rel="stylesheet" href="/tools/static/css/personal-utilities.css"></head>
<body data-tool="clipboard">{{template "nav" .}}<main class="utility"><a href="/tools/personal">← 个人工具</a><h1>个人剪贴板</h1><div id="status" role="status" aria-live="polite"></div><p>文字和链接随手存，两端登录后同步。每条最多 32 KB，可保存 200 条，内容会保留直到你删除。</p><section class="panel"><label for="text">文字内容</label><textarea id="text" placeholder="粘贴要在另一台设备使用的文字或链接"></textarea><div class="row"><button id="save" class="primary">保存到剪贴板</button><button id="cancel" hidden>取消编辑</button></div></section><section class="panel"><div class="row"><h2>历史内容</h2><span id="count"></span><button id="refresh">刷新</button></div><input id="search" type="search" placeholder="搜索内容" aria-label="搜索内容"><div id="items"></div></section></main><script src="/tools/static/js/personal-utilities.js"></script></body></html>
{{end}}
