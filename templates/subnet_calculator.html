{{define "subnet_calculator"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP子网计算器 - CIDR网段换算 | 程序员工具箱</title>
    <meta name="description" content="免费在线 IP 子网计算器：输入 IP 与 CIDR，换算网络地址、广播地址、可用 IP 范围、主机数量、子网掩码。">
    <meta name="keywords" content="子网计算器,IP计算,CIDR,子网掩码,网络地址,广播地址,在线工具">
    <link rel="canonical" href="https://www.johnkingzcq123.xyz/tools/subnet-calculator">
    <link rel="icon" type="image/x-icon" href="/tools/static/favicon.ico">
    <link rel="stylesheet" href="/tools/static/css/style.css">
    <link rel="stylesheet" href="/tools/static/css/tools.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "IP子网计算器",
      "description": "免费在线 IP 子网计算器：CIDR 与掩码换算，网络地址、广播地址、可用范围一键得出。",
      "url": "https://www.johnkingzcq123.xyz/tools/subnet-calculator",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web Browser",
      "offers": {"@type": "Offer", "price": "0", "priceCurrency": "CNY"}
    }
    </script>
    <style>
        .kv-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .kv-table td { border: 1px solid #e5e7eb; padding: .6rem .8rem; }
        .kv-table td:first-child { background: #f9fafb; font-weight: 600; width: 9em; }
        .kv-table td:last-child { font-family: ui-monospace,Menlo,Consolas,monospace; word-break: break-all; }
        .ip-inputs { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    {{template "nav" .}}
    <div class="container">
        <div class="tool-header">
            <h1><i class="material-icons">router</i> IP 子网计算器</h1>
            <p>输入 IP 与 CIDR（或子网掩码），换算网络地址、广播地址与可用范围</p>
        </div>
        <div class="tool-content" style="max-width:640px;margin:auto;">
            <div class="tool-card" style="margin-bottom:2rem;">
                <div class="form-group">
                    <label>IP 地址 / 前缀长度：</label>
                    <div class="ip-inputs" style="margin-top:.5rem;">
                        <input id="subnet-ip" type="text" class="input-area" placeholder="192.168.1.100" style="flex:2;min-width:10em;" spellcheck="false">
                        <span style="font-size:1.4rem;color:#6b7280;">/</span>
                        <input id="subnet-cidr" type="number" class="input-area" min="0" max="32" value="24" style="flex:1;min-width:5em;">
                    </div>
                </div>
                <div class="form-group" style="margin-top:1rem;">
                    <label for="subnet-mask">或直接输入子网掩码：</label>
                    <input id="subnet-mask" type="text" class="input-area" placeholder="255.255.255.0（留空则用上面的 CIDR）" style="width:100%;" spellcheck="false">
                </div>
                <div class="form-actions" style="margin-top:1.2rem;">
                    <button onclick="calcSubnet()" class="btn btn-primary"><i class="material-icons">calculate</i> 计算</button>
                    <button type="button" class="btn btn-secondary" onclick="clearSubnet()">清空</button>
                </div>
                <div class="result-section" style="margin-top:1rem;">
                    <div id="subnet-result"></div>
                </div>
            </div>
            <div class="tool-card">
                <h3>常用网段速查</h3>
                <div style="color:#374151;line-height:2;font-size:1rem;">
                    <b>10.0.0.0/8</b>：A 类私有地址，1677 万主机<br>
                    <b>172.16.0.0/12</b>：B 类私有地址，104 万主机<br>
                    <b>192.168.0.0/16</b>：C 类私有地址，6.5 万主机<br>
                    <b>/24</b> 含 254 个可用主机，<b>/30</b> 含 2 个（常用于点对点链路），<b>/32</b> 表示单个主机
                </div>
            </div>
        </div>
    </div>
    <script>
    function ipToInt(ip) {
        var parts = ip.trim().split('.');
        if (parts.length !== 4) return null;
        var n = 0;
        for (var i = 0; i < 4; i++) {
            if (!/^\d+$/.test(parts[i])) return null;
            var v = parseInt(parts[i], 10);
            if (v < 0 || v > 255) return null;
            n = n * 256 + v;
        }
        return n >>> 0;
    }
    function intToIp(n) {
        n = n >>> 0;
        return [Math.floor(n / 16777216) % 256, Math.floor(n / 65536) % 256, Math.floor(n / 256) % 256, n % 256].join('.');
    }
    function maskToCidr(maskInt) {
        var cidr = 0, m = maskInt >>> 0;
        while (m & 0x80000000) { cidr++; m = (m << 1) >>> 0; }
        if (m !== 0) return -1;
        return cidr;
    }
    function calcSubnet() {
        var ipStr = document.getElementById('subnet-ip').value;
        var maskStr = document.getElementById('subnet-mask').value.trim();
        var out = document.getElementById('subnet-result');
        var ip = ipToInt(ipStr);
        if (ip === null) { out.innerHTML = '<span style="color:#dc2626;">IP 地址格式错误，应为 x.x.x.x（每段 0-255）</span>'; return; }
        var cidr;
        if (maskStr) {
            var maskInt = ipToInt(maskStr);
            if (maskInt === null) { out.innerHTML = '<span style="color:#dc2626;">子网掩码格式错误</span>'; return; }
            cidr = maskToCidr(maskInt);
            if (cidr < 0) { out.innerHTML = '<span style="color:#dc2626;">子网掩码不合法（1 后面不能再出现 0，如 255.0.255.0）</span>'; return; }
        } else {
            cidr = parseInt(document.getElementById('subnet-cidr').value, 10);
            if (!(cidr >= 0 && cidr <= 32)) { out.innerHTML = '<span style="color:#dc2626;">CIDR 前缀长度应在 0-32 之间</span>'; return; }
        }
        var mask = cidr === 0 ? 0 : (0xFFFFFFFF << (32 - cidr)) >>> 0;
        var network = (ip & mask) >>> 0;
        var broadcast = (network | (~mask >>> 0)) >>> 0;
        var hostBits = 32 - cidr;
        var total = Math.pow(2, hostBits);
        var usable, firstUsable, lastUsable;
        if (cidr >= 31) { usable = total; firstUsable = intToIp(network); lastUsable = intToIp(broadcast); }
        else { usable = total - 2; firstUsable = intToIp(network + 1); lastUsable = intToIp(broadcast - 1); }
        var wildcard = intToIp((~mask) >>> 0);
        out.innerHTML = '<table class="kv-table">' +
            kv('CIDR 表示', intToIp(network) + '/' + cidr) +
            kv('子网掩码', intToIp(mask)) +
            kv('反掩码（通配符）', wildcard) +
            kv('网络地址', intToIp(network)) +
            kv('广播地址', intToIp(broadcast)) +
            kv('可用 IP 范围', firstUsable + ' ~ ' + lastUsable) +
            kv('可用主机数', usable.toLocaleString()) +
            kv('地址总数', total.toLocaleString()) +
            '</table>';
    }
    function kv(k, v) { return '<tr><td>' + k + '</td><td>' + v + '</td></tr>'; }
    function clearSubnet() {
        document.getElementById('subnet-ip').value = '';
        document.getElementById('subnet-mask').value = '';
        document.getElementById('subnet-result').innerHTML = '';
    }
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('subnet-ip').value = '192.168.1.100';
        calcSubnet();
    });
    </script>
</body>
</html>
{{end}}
