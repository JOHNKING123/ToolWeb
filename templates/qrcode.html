{{define "qrcode"}}
<div class="tool-container">
    <h1><i class="material-icons">qr_code</i> 二维码工具</h1>
    <div>
        <div class="section-title">生成二维码</div>
        <div class="row"><label>内容</label><input type="text" id="qrText" placeholder="输入文本或链接..." style="width:70%;padding:0.5rem;"></div>
        <div class="row"><label>大小</label><input type="number" id="qrSize" value="256" min="128" max="1024" step="8" style="width:80px;"> px</div>
        <div class="row"><label>前景色</label><input type="color" id="qrFgColor" value="#000000"> <label>背景色</label><input type="color" id="qrBgColor" value="#ffffff"></div>
        <div class="row"><label>Logo</label><input type="file" id="qrLogo" accept="image/*"></div>
        <button id="genBtn" class="btn btn-primary"><i class="material-icons">auto_fix_high</i> 生成</button>
        <div id="qrResult"></div>
    </div>
    <div>
        <div class="section-title">识别二维码</div>
        <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:.6rem;padding:.8rem 1rem;font-size:.92rem;line-height:1.9;color:#1e40af;">
            <b>📷 二维码一条龙：</b>识别二维码图片请前往 <a href="/tools/qr-scanner" style="color:#1d4ed8;font-weight:700;">二维码扫描器</a> —— 上传／拖拽／粘贴图片，浏览器本地 jsQR 解码（零上传、零外部请求），解码文本一键复制、http/https 链接一键打开、定位框可视化、结果可下载。原页面内「识别」按钮调用的后端解码接口尚未实现，已统一收敛到新工具。
        </div>
    </div>
    <div style="background:#f0fdfa;border:1px solid #99f6e0;border-radius:.6rem;padding:.7rem 1rem;margin-top:1.2rem;font-size:.92rem;line-height:1.8;color:#0f766e;">
        <b>💬 沟通一条龙：</b>需要把手机号做成「点一下就开聊」的 WhatsApp 聊天链接，用 <a href="/tools/whatsapp-link-generator" style="color:#0d9488;font-weight:600;">WhatsApp 链接生成器</a>（wa.me 链接＋预填消息＋内嵌二维码）—— 生成聊天入口、分享二维码，一套流程。
    </div>
</div>
<script>
// 生成二维码
const genBtn = document.getElementById('genBtn');
genBtn.onclick = async function() {
    const text = document.getElementById('qrText').value.trim();
    const size = parseInt(document.getElementById('qrSize').value) || 256;
    const fgColor = document.getElementById('qrFgColor').value;
    const bgColor = document.getElementById('qrBgColor').value;
    if (!text) return alert('请输入内容');
    if (document.getElementById('qrLogo').files[0]) {
        // 当前后端生成接口不支持叠加 Logo，先如实提示再生成普通二维码
        alert('提示：Logo 叠加暂未启用，本次将生成不带 Logo 的二维码');
    }
    // 后端接口为 POST /tools/api/qrcode（JSON 入参，返回 PNG 图片）；
    // 此前页面误用不存在的 /tools/api/qrcode/generate 且发 FormData，恒失败。
    try {
        const res = await fetch('/tools/api/qrcode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, size: size, fgColor: fgColor, bgColor: bgColor })
        });
        if (!res.ok) {
            let msg = '生成失败（HTTP ' + res.status + '）';
            try {
                const data = await res.json();
                if (data && data.error) msg = '生成失败：' + data.error;
            } catch (e) { /* 响应非 JSON 时用默认提示 */ }
            document.getElementById('qrResult').innerHTML = `<span style='color:red'>${msg}</span>`;
            return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        document.getElementById('qrResult').innerHTML = `<img src="${url}" class="qrcode-img">`;
    } catch (err) {
        document.getElementById('qrResult').innerHTML = `<span style='color:red'>生成失败：${err.message}</span>`;
    }
};
// 「识别二维码」已收敛到 /tools/qr-scanner（浏览器本地 jsQR 解码）：
// 页面保留跳转入口，此处不再调用未实现的后端 /tools/api/qrcode/decode。
</script>
</div>
</body>
</html>
{{end}}
