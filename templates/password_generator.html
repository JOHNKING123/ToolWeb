{{define "password_generator"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器 - 在线生成高强度密码 | 程序员工具箱</title>
    <meta name="description" content="免费在线随机密码生成器：自定义长度与字符集，基于密码学安全随机数，显示密码强度（熵值），一键复制。">
    <meta name="keywords" content="密码生成器,随机密码,强密码,在线密码生成,密码强度,程序员工具">
    <link rel="canonical" href="https://www.johnkingzcq123.xyz/tools/password-generator">
    <link rel="icon" type="image/x-icon" href="/tools/static/favicon.ico">
    <link rel="stylesheet" href="/tools/static/css/style.css">
    <link rel="stylesheet" href="/tools/static/css/tools.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "随机密码生成器",
      "description": "免费在线随机密码生成器：自定义长度与字符集，基于密码学安全随机数，显示密码强度。",
      "url": "https://www.johnkingzcq123.xyz/tools/password-generator",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web Browser",
      "offers": {"@type": "Offer", "price": "0", "priceCurrency": "CNY"}
    }
    </script>
    <style>
        .strength-bar { height: 8px; border-radius: 4px; background: #e5e7eb; overflow: hidden; margin-top: .5rem; }
        .strength-fill { height: 100%; border-radius: 4px; transition: width .3s, background .3s; }
        .pwd-row { display: flex; align-items: center; gap: .6rem; padding: .5rem 0; border-bottom: 1px dashed #e5e7eb; }
        .pwd-text { flex: 1; font-family: ui-monospace,Menlo,Consolas,monospace; word-break: break-all; font-size: .95rem; }
        input[type=range] { width: 100%; }
    </style>
</head>
<body>
    {{template "nav" .}}
    <div class="container">
        <div class="tool-header">
            <h1><i class="material-icons">password</i> 随机密码生成器</h1>
            <p>生成高强度随机密码，纯本地运算，不经过网络</p>
        </div>
        <div class="tool-content" style="max-width:640px;margin:auto;">
            <div class="tool-card" style="margin-bottom:2rem;">
                <div class="form-group">
                    <label for="pwd-len">密码长度：<b id="pwd-len-label" style="color:#2563eb;">16</b></label>
                    <input id="pwd-len" type="range" min="4" max="128" value="16">
                </div>
                <div class="form-group" style="margin-top:1rem;display:flex;flex-wrap:wrap;gap:1.2rem;">
                    <label><input type="checkbox" id="pwd-lower" checked> 小写字母 a-z</label>
                    <label><input type="checkbox" id="pwd-upper" checked> 大写字母 A-Z</label>
                    <label><input type="checkbox" id="pwd-digit" checked> 数字 0-9</label>
                    <label><input type="checkbox" id="pwd-symbol" checked> 符号 !@#$…</label>
                    <label><input type="checkbox" id="pwd-noamb"> 排除易混淆字符 <span style="color:#9ca3af;">(0O1lI)</span></label>
                </div>
                <div class="form-group" style="margin-top:1rem;">
                    <label for="pwd-count">生成数量（1-50）：</label>
                    <input id="pwd-count" type="number" min="1" max="50" value="5" class="input-area" style="width:8em;">
                </div>
                <div class="form-actions" style="margin-top:1.5rem;">
                    <button onclick="genPasswords()" class="btn btn-primary"><i class="material-icons">autorenew</i> 生成密码</button>
                    <button class="btn btn-secondary" onclick="copyAllPwds()"><i class="material-icons">content_copy</i> 复制全部</button>
                </div>
                <div style="margin-top:1rem;">
                    <div style="font-size:.9rem;color:#6b7280;">密码强度：<b id="pwd-strength-label">-</b> <span id="pwd-entropy" style="color:#9ca3af;"></span></div>
                    <div class="strength-bar"><div id="pwd-strength-fill" class="strength-fill" style="width:0;"></div></div>
                </div>
            </div>
            <div class="tool-card">
                <div class="result-section">
                    <h3>生成结果 <span style="font-size:.8rem;color:#9ca3af;font-weight:normal;">（点击单条右侧按钮复制）</span></h3>
                    <div id="pwd-result" class="result-area" style="min-height:2.5em;"></div>
                </div>
            </div>
            <div class="tool-card" style="margin-top:2rem;">
                <h3>使用建议</h3>
                <div style="color:#374151;line-height:1.8;font-size:1rem;">
                    <b>长度优先于复杂度：</b>16 位混合字符密码的熵约 100 bit，已足够抵抗暴力破解。<br>
                    <b>每个网站用不同密码</b>，配合密码管理器使用。<br>
                    本工具使用浏览器 <b>crypto.getRandomValues</b> 生成，密码只存在于你的浏览器内存中，不会上传到任何服务器。
                </div>
            </div>
        </div>
    </div>
    <script>
    var lastPwds = [];
    var LOWER = 'abcdefghijklmnopqrstuvwxyz';
    var UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    var DIGIT = '0123456789';
    var SYMBOL = '!@#$%^&*()-_=+[]{};:,.<>?/~';
    var AMBIGUOUS = '0O1lI';
    function buildCharset() {
        var s = '';
        if (document.getElementById('pwd-lower').checked) s += LOWER;
        if (document.getElementById('pwd-upper').checked) s += UPPER;
        if (document.getElementById('pwd-digit').checked) s += DIGIT;
        if (document.getElementById('pwd-symbol').checked) s += SYMBOL;
        if (document.getElementById('pwd-noamb').checked) {
            s = s.split('').filter(function(ch) { return AMBIGUOUS.indexOf(ch) === -1; }).join('');
        }
        return s;
    }
    function genOne(len, charset) {
        var buf = new Uint8Array(len);
        crypto.getRandomValues(buf);
        var out = '';
        for (var i = 0; i < len; i++) out += charset[buf[i] % charset.length];
        return out;
    }
    function entropyBits(len, charsetSize) { return len * Math.log2(charsetSize); }
    function strengthInfo(bits) {
        if (bits < 40) return { label: '弱', color: '#dc2626', pct: 20 };
        if (bits < 60) return { label: '一般', color: '#f59e0b', pct: 40 };
        if (bits < 80) return { label: '较强', color: '#3b82f6', pct: 60 };
        if (bits < 100) return { label: '强', color: '#10b981', pct: 80 };
        return { label: '非常强', color: '#059669', pct: 100 };
    }
    function genPasswords() {
        var len = parseInt(document.getElementById('pwd-len').value, 10);
        var count = parseInt(document.getElementById('pwd-count').value, 10);
        if (!count || count < 1) count = 1;
        if (count > 50) count = 50;
        document.getElementById('pwd-count').value = count;
        var charset = buildCharset();
        if (!charset) { toast('请至少选择一种字符集'); return; }
        lastPwds = [];
        for (var i = 0; i < count; i++) lastPwds.push(genOne(len, charset));
        renderPwds();
        var bits = entropyBits(len, charset.length);
        var st = strengthInfo(bits);
        document.getElementById('pwd-strength-label').textContent = st.label;
        document.getElementById('pwd-strength-label').style.color = st.color;
        document.getElementById('pwd-entropy').textContent = '（约 ' + bits.toFixed(0) + ' bit 熵）';
        var fill = document.getElementById('pwd-strength-fill');
        fill.style.width = st.pct + '%';
        fill.style.background = st.color;
    }
    function renderPwds() {
        var out = document.getElementById('pwd-result');
        out.innerHTML = lastPwds.map(function(p, i) {
            return '<div class="pwd-row"><span class="pwd-text">' + escapeHtml(p) + '</span>' +
                '<button class="btn btn-secondary btn-sm" onclick="copyOnePwd(' + i + ')">复制</button></div>';
        }).join('');
    }
    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function copyOnePwd(i) { copyText(lastPwds[i], '已复制'); }
    function copyAllPwds() {
        if (!lastPwds.length) { toast('请先生成密码'); return; }
        copyText(lastPwds.join('\n'), '已复制 ' + lastPwds.length + ' 个密码');
    }
    function copyText(t, okMsg) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(t).then(function() { toast(okMsg || '已复制'); }, function() { toast('复制失败，请手动复制'); });
        } else {
            var ta = document.createElement('textarea');
            ta.value = t; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); toast(okMsg || '已复制'); } catch (e) { toast('复制失败，请手动复制'); }
            document.body.removeChild(ta);
        }
    }
    function toast(msg) {
        var el = document.createElement('div');
        el.textContent = msg;
        el.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:.6rem 1.2rem;border-radius:.5rem;z-index:9999;font-size:.9rem;';
        document.body.appendChild(el);
        setTimeout(function() { document.body.removeChild(el); }, 1600);
    }
    document.addEventListener('DOMContentLoaded', function() {
        var lenInput = document.getElementById('pwd-len');
        var label = document.getElementById('pwd-len-label');
        lenInput.addEventListener('input', function() { label.textContent = lenInput.value; });
        genPasswords();
    });
    </script>
</body>
</html>
{{end}}
