<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 三节混沌摆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a14;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #e0e0e0; overflow: hidden;
  }
  h1 { margin: 14px 0 10px; font-size: 22px; color: #40c8ff;
       text-shadow: 0 0 12px rgba(64,200,255,0.3); }
  .main { display: flex; gap: 16px; align-items: flex-start; }
  #canvas-container {
    border: 2px solid #40c8ff; border-radius: 4px;
    box-shadow: 0 0 25px rgba(64,200,255,0.12); cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }
  .panel {
    background: #12122a; border-radius: 8px; padding: 16px;
    width: 220px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .panel label { display: block; margin-bottom: 3px; font-size: 12px; color: #aaa; }
  .panel input[type="range"] { width: 100%; margin-bottom: 12px; accent-color: #40c8ff; }
  .panel .val { font-size: 13px; color: #40c8ff; font-weight: bold; }
  .panel button {
    width: 100%; padding: 8px; margin-top: 4px;
    background: #40c8ff; color: #000; border: none; border-radius: 4px;
    font-weight: bold; cursor: pointer; font-size: 13px;
  }
  .panel button:hover { background: #66d8ff; }
  .sep { height: 1px; background: #333; margin: 10px 0; }
  .info { font-size: 11px; color: #555; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>

<h1>3D 三节混沌摆 (Triple Pendulum)</h1>
<div class="main">
  <div id="canvas-container"></div>
  <div class="panel">
    <label>速度倍率: <span id="spdV" class="val">1.0x</span></label>
    <input type="range" id="spd" min="0" max="30" value="10">

    <label>轨迹长度: <span id="trlV" class="val">800</span></label>
    <input type="range" id="trl" min="0" max="2000" value="800" step="100">

    <label>摆杆1 长度: <span id="l1V" class="val">3.0</span></label>
    <input type="range" id="l1" min="10" max="50" value="30">
    <label>摆杆2 长度: <span id="l2V" class="val">2.5</span></label>
    <input type="range" id="l2" min="10" max="50" value="25">
    <label>摆杆3 长度: <span id="l3V" class="val">2.0</span></label>
    <input type="range" id="l3" min="10" max="50" value="20">

    <div class="sep"></div>
    <label>初始角度1: <span id="a1V" class="val">120°</span></label>
    <input type="range" id="a1" min="0" max="360" value="120">
    <label>初始角度2: <span id="a2V" class="val">150°</span></label>
    <input type="range" id="a2" min="0" max="360" value="150">
    <label>初始角度3: <span id="a3V" class="val">180°</span></label>
    <input type="range" id="a3" min="0" max="360" value="180">

    <button id="resetBtn">释放 / 重置</button>

    <p class="info">
      经典混沌摆模型<br>
      拉格朗日力学精确求解<br>
      初始条件微小差异 → 运动轨迹完全不同<br>
      拖拽旋转视角 · 滚轮缩放
    </p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   三节混沌摆 — 拉格朗日方程 + 四阶 Runge-Kutta 积分
   状态向量: [θ1, θ2, θ3, ω1, ω2, ω3]
   θ 从竖直向下量起
   ============================================================ */

const G = 9.81;

// ---------- 读 UI ----------
const $ = id => document.getElementById(id);
function getLen(i) { return parseInt($('l' + i).value) / 10; }
function getAng(i) { return parseInt($('a' + i).value) * Math.PI / 180; }
function getSpdMul() { return parseInt($('spd').value) / 10; }
function getTrailLen() { return parseInt($('trl').value); }

// 质量统一为 1
const M1 = 1, M2 = 1, M3 = 1;

/* ---------- 运动方程 ----------
   对三节摆用拉格朗日方程推导出的质量矩阵 M·α = F 形式,
   每步解线性方程组得到角加速度 α1, α2, α3.
   参考: https://scienceworld.wolfram.com/physics/TriplePendulum.html
*/
function deriv(s, L1, L2, L3) {
  const [t1, t2, t3, w1, w2, w3] = s;
  const c12 = Math.cos(t1 - t2), s12 = Math.sin(t1 - t2);
  const c13 = Math.cos(t1 - t3), s13 = Math.sin(t1 - t3);
  const c23 = Math.cos(t2 - t3), s23 = Math.sin(t2 - t3);

  // 质量矩阵 M (3x3 对称)
  const m11 = (M1 + M2 + M3) * L1;
  const m12 = (M2 + M3) * L2 * c12;
  const m13 = M3 * L3 * c13;
  const m21 = (M2 + M3) * L1 * c12;
  const m22 = (M2 + M3) * L2;
  const m23 = M3 * L3 * c23;
  const m31 = M3 * L1 * c13;
  const m32 = M3 * L2 * c23;
  const m33 = M3 * L3;

  // 右端力 F
  const f1 = -(M2 + M3) * L2 * w2 * w2 * s12
             - M3 * L3 * w3 * w3 * s13
             - (M1 + M2 + M3) * G * Math.sin(t1);
  const f2 =  (M2 + M3) * L1 * w1 * w1 * s12
             - M3 * L3 * w3 * w3 * s23
             - (M2 + M3) * G * Math.sin(t2);
  const f3 =  M3 * L1 * w1 * w1 * s13
             + M3 * L2 * w2 * w2 * s23
             - M3 * G * Math.sin(t3);

  // 解 3x3 线性方程 Mα = F (Cramer 法则)
  const det = m11*(m22*m33 - m23*m32)
            - m12*(m21*m33 - m23*m31)
            + m13*(m21*m32 - m22*m31);
  if (Math.abs(det) < 1e-14) return [w1, w2, w3, 0, 0, 0];

  const a1 = ( f1*(m22*m33-m23*m32) - m12*(f2*m33-m23*f3) + m13*(f2*m32-m22*f3) ) / det;
  const a2 = ( m11*(f2*m33-m23*f3)  - f1*(m21*m33-m23*m31) + m13*(m21*f3-f2*m31) ) / det;
  const a3 = ( m11*(m22*f3-f2*m32)  - m12*(m21*f3-f2*m31) + f1*(m21*m32-m22*m31) ) / det;

  return [w1, w2, w3, a1, a2, a3];
}

// RK4 积分
function rk4Step(s, dt, L1, L2, L3) {
  const k1 = deriv(s, L1, L2, L3);
  const s2 = s.map((v,i) => v + k1[i] * dt * 0.5);
  const k2 = deriv(s2, L1, L2, L3);
  const s3 = s.map((v,i) => v + k2[i] * dt * 0.5);
  const k3 = deriv(s3, L1, L2, L3);
  const s4 = s.map((v,i) => v + k3[i] * dt);
  const k4 = deriv(s4, L1, L2, L3);
  return s.map((v,i) => v + (k1[i] + 2*k2[i] + 2*k3[i] + k4[i]) * dt / 6);
}

// ===================== Three.js 场景 =====================
const container = $('canvas-container');
const W = 820, H = 700;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08081a);

const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 200);
camera.position.set(0, -2, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.08;
ctrl.target.set(0, -3, 0);

// 光照
scene.add(new THREE.AmbientLight(0x445566, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(5, 8, 10);
dir.castShadow = true;
scene.add(dir);
const pt = new THREE.PointLight(0x6699ff, 0.8, 30);
pt.position.set(-4, 2, 6);
scene.add(pt);

// 简约背景网格
const gridHelper = new THREE.GridHelper(20, 20, 0x222244, 0x151530);
gridHelper.rotation.x = Math.PI / 2;
gridHelper.position.z = -1;
scene.add(gridHelper);

// -------- 摆的可视对象 --------
const rodMats = [
  new THREE.MeshStandardMaterial({ color: 0xdd4444, roughness: 0.3, metalness: 0.7 }),
  new THREE.MeshStandardMaterial({ color: 0x44bb44, roughness: 0.3, metalness: 0.7 }),
  new THREE.MeshStandardMaterial({ color: 0x4488ee, roughness: 0.3, metalness: 0.7 }),
];
const bobMat  = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.15, metalness: 0.9 });
const pivMat  = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.8 });

const rodGeo = new THREE.CylinderGeometry(1, 1, 1, 16);
const rodMeshes = rodMats.map(m => {
  const mesh = new THREE.Mesh(rodGeo, m);
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
});

const bobGeo = new THREE.SphereGeometry(1, 20, 14);
const bobMeshes = [];
for (let i = 0; i < 3; i++) {
  const mesh = new THREE.Mesh(bobGeo, bobMat);
  mesh.castShadow = true;
  scene.add(mesh);
  bobMeshes.push(mesh);
}

// 悬挂支点
const pivotMesh = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8), pivMat);
pivotMesh.position.set(0, 0, 0);
scene.add(pivotMesh);
// 支架
const mountGeo = new THREE.CylinderGeometry(0.06, 0.06, 2.0, 8);
const mountMesh = new THREE.Mesh(mountGeo, pivMat);
mountMesh.position.set(0, 1, 0);
mountMesh.castShadow = true;
scene.add(mountMesh);

// -------- 轨迹 --------
const TRAIL_CAP = 3000;
const trailBufs = [new Float32Array(TRAIL_CAP*3), new Float32Array(TRAIL_CAP*3), new Float32Array(TRAIL_CAP*3)];
const trailGeoms = trailBufs.map(buf => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(buf, 3));
  g.setDrawRange(0, 0);
  return g;
});
const trailColors = [0xff4444, 0x44dd44, 0x4499ff];
const trailLines = trailGeoms.map((g, i) => {
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({
    color: trailColors[i], transparent: true, opacity: 0.45
  }));
  scene.add(l);
  return l;
});
let trailCounts = [0, 0, 0];

// ===================== 状态 =====================
let state; // [θ1, θ2, θ3, ω1, ω2, ω3]
let L1, L2, L3;

function resetState() {
  L1 = getLen(1); L2 = getLen(2); L3 = getLen(3);
  state = [getAng(1), getAng(2), getAng(3), 0, 0, 0];
  trailCounts = [0, 0, 0];
  for (const g of trailGeoms) g.setDrawRange(0, 0);
}

// ===================== 位置计算 =====================
function positions() {
  const [t1, t2, t3] = state;
  const x1 =  L1 * Math.sin(t1);
  const y1 = -L1 * Math.cos(t1);
  const x2 = x1 + L2 * Math.sin(t2);
  const y2 = y1 - L2 * Math.cos(t2);
  const x3 = x2 + L3 * Math.sin(t3);
  const y3 = y2 - L3 * Math.cos(t3);
  return [[x1,y1],[x2,y2],[x3,y3]];
}

// ===================== 渲染更新 =====================
const _y = new THREE.Vector3(0, 1, 0);
const _d = new THREE.Vector3();

function updateVisuals() {
  const ps = positions();
  const pts = [[0,0], ...ps]; // 4 个点: 支点 + 3 个质点

  // 摆杆
  for (let i = 0; i < 3; i++) {
    const [ax, ay] = pts[i];
    const [bx, by] = pts[i+1];
    const mesh = rodMeshes[i];
    const r = 0.08 - i * 0.01; // 逐渐变细
    _d.set(bx - ax, by - ay, 0);
    const len = _d.length();
    mesh.position.set((ax+bx)/2, (ay+by)/2, 0);
    mesh.scale.set(r, Math.max(len, 0.01), r);
    if (len > 1e-4) mesh.quaternion.setFromUnitVectors(_y, _d.normalize());
  }

  // 质点（球）
  for (let i = 0; i < 3; i++) {
    const [px, py] = ps[i];
    const r = 0.22 - i * 0.03;
    bobMeshes[i].position.set(px, py, 0);
    bobMeshes[i].scale.setScalar(r);
  }
}

// ===================== 动画循环 =====================
const PHYS_DT = 1 / 1000; // 高精度物理步长
let lastT = 0;
let trailTick = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  const raw = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;

  const mul = getSpdMul();
  const simTime = raw * mul;
  const steps = Math.max(1, Math.round(simTime / PHYS_DT));
  const dt = simTime / steps;

  for (let i = 0; i < steps; i++) {
    state = rk4Step(state, dt, L1, L2, L3);
  }

  updateVisuals();

  // 轨迹采样
  const maxTrail = getTrailLen();
  trailTick++;
  if (trailTick % 2 === 0 && mul > 0) {
    const ps = positions();
    for (let i = 0; i < 3; i++) {
      const idx = (trailCounts[i] % TRAIL_CAP) * 3;
      trailBufs[i][idx]   = ps[i][0];
      trailBufs[i][idx+1] = ps[i][1];
      trailBufs[i][idx+2] = 0;
      trailCounts[i]++;
      const draw = Math.min(trailCounts[i], TRAIL_CAP, maxTrail);
      trailGeoms[i].setDrawRange(0, draw);
      trailGeoms[i].attributes.position.needsUpdate = true;
    }
  }

  ctrl.update();
  renderer.render(scene, camera);
}

// ===================== UI 事件 =====================
$('spd').oninput = () => $('spdV').textContent = (parseInt($('spd').value)/10).toFixed(1) + 'x';
$('trl').oninput = () => $('trlV').textContent = $('trl').value;
for (const k of ['l1','l2','l3']) {
  $(k).oninput = () => $(k+'V').textContent = (parseInt($(k).value)/10).toFixed(1);
}
for (const k of ['a1','a2','a3']) {
  $(k).oninput = () => $(k+'V').textContent = $(k).value + '°';
}
$('resetBtn').onclick = resetState;

// ===================== 启动 =====================
resetState();
requestAnimationFrame(loop);
</script>
</body>
</html>
