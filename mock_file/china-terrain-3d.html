<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ═══════════════ CONSTANTS ═══════════════ */
const LO0 = 60, LO1 = 150, LA0 = 0, LA1 = 60;
const GW = 580, GH = 400;          // grid segments (high detail for sharp ridges)
const TW = 90, TH = 60;            // world-space size
const ES = 0.00085;                 // elevation → world (vertical exaggeration ≈ 80×)

/* ═══════════════ HELPERS ═══════════════ */
const lerp  = (a,b,t) => a+(b-a)*t;
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const ss    = (e0,e1,x) => { x=clamp((x-e0)/(e1-e0),0,1); return x*x*(3-2*x); };
const gauss = (x,s) => Math.exp(-x*x/(2*s*s));
const dist2 = (x1,y1,x2,y2) => Math.sqrt((x1-x2)**2+(y1-y2)**2);

function dSeg(px,py,ax,ay,bx,by){
    const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
    if(!l2) return dist2(px,py,ax,ay);
    const t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1);
    return dist2(px,py,ax+t*dx,ay+t*dy);
}
function dPoly(px,py,pts){
    let m=1e9;
    for(let i=0;i<pts.length-1;i++) m=Math.min(m,dSeg(px,py,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]));
    return m;
}

/* geo ↔ world */
function g2w(lon,lat){ return [(lon-LO0)/(LO1-LO0)*TW-TW/2, (LA1-lat)/(LA1-LA0)*TH-TH/2]; }
function w2g(x,z){ return [LO0+(x+TW/2)/TW*(LO1-LO0), LA1-(z+TH/2)/TH*(LA1-LA0)]; }

/* ═══════════════ NOISE ═══════════════ */
const _fr = x=>x-Math.floor(x);
const _h  = (x,y)=>_fr(Math.sin(x*127.1+y*311.7)*43758.5453);
function n2d(x,y){
    const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
    const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
    return lerp(lerp(_h(ix,iy),_h(ix+1,iy),ux), lerp(_h(ix,iy+1),_h(ix+1,iy+1),ux), uy);
}
function fbm(x,y,oct=5){
    let v=0,a=1,f=1,s=0;
    for(let i=0;i<oct;i++){v+=a*n2d(x*f,y*f);s+=a;a*=.5;f*=2;}
    return v/s;
}

/* ═══════════════ COASTLINE POLYGONS ═══════════════ */
function pip(px,py,poly){
    let ins=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
        const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
        if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi) ins=!ins;
    }
    return ins;
}

const ASIA=[
    [60,60],[150,60],
    [150,55.5],[147,53],[145,51],[143,49],[142,47],[141,45.5],
    [139,44.5],[137,43.8],[135.5,43.3],[133,43],[131.5,43],
    [130.5,42],[129.5,40.5],[129.2,39],[129,37.5],[129,36],[128.5,35.5],[127.5,35],[127,34.5],
    [126,34.5],[126,35.5],[125.5,37],[125,38.5],
    [124,39.5],[123,39.8],[122.5,40],
    [122,39.5],[121.5,39.2],
    [121,38.8],[120,38.3],[119.2,38],[118.5,37.5],
    [118,37],[117.8,36.5],
    [118.5,36],[119.5,36.2],[120.5,36.5],[121.5,37],[122.5,37],
    [123,36.5],[122,35.5],[121.5,35],
    [121,34],[121,33],[121.5,32],
    [122,31],[122.2,30],[122,29],[121.5,28],
    [121,27],[120.5,26.2],[119.5,25.5],[118.5,25],
    [117.5,24],[117,23.5],[116,23],[115,22.5],
    [114,22.5],[113.2,22],[112,21.5],[110.5,21],[109.5,21.5],[108.5,21.5],
    [108,20],[107.2,18],[106.8,17],
    [107.2,15],[108,13.5],[109,12],
    [108.2,11],[107,10.5],[106.5,10],[106,9.5],[105.2,9],
    [104.5,8],[103.5,7],[102.5,6.5],[101.5,5.5],[101,4.5],[100.8,3],[103,1.5],[104,1],[104.5,0],
    [100,0],[99,2],[98,4.5],[97,6.5],[96,8.5],
    [95,10.5],[94.5,12],[94,14.5],[93.5,16.5],[93,18],[92.5,20],[91.5,21.5],
    [90,22],[89,22.5],
    [87,21.2],[85.5,20],[83.5,17.5],[82,15.5],[81,14],[80.5,12],[79.5,10],[78.5,8.5],[77.5,8],
    [76.8,8.3],[76,9],[75.5,10],
    [74.5,12],[73.5,15],[73,17.5],[72.5,19.5],[72,21],[70.5,22.5],
    [69,23.5],[68,24],[67,24.5],
    [66,25],[64.5,25.5],[62.5,25.5],[61,25.5],[60,26],
    [60,60]
];

const JAPAN_H=[[139,35.5],[139.8,36.5],[140,37.5],[140.2,38.5],[140.5,39.5],[140.3,40.5],[139.5,40],
    [138,38.5],[137,37.5],[136,36.5],[135,35.5],[134,34.8],[133,34.3],[132,33.8],[131.2,33.5],
    [131.5,34],[133,34.5],[135,35],[137,35.5],[139,35.5]];
const JAPAN_K=[[140,42],[141.5,43],[143,43.5],[145,43.3],[145.2,42.5],[144,42],[142,41.8],[140,42]];
const JAPAN_Y=[[130,33.3],[131,33.5],[131.5,33],[131.5,32],[131,31.2],[130.3,31.5],[130,32.5],[130,33.3]];
const JAPAN_S=[[132.5,34],[133.8,34],[134.2,33.5],[134,33],[133,33],[132.5,33.5],[132.5,34]];
const TAIWAN=[[120.3,25.2],[121.2,25.5],[122,25],[121.5,24],[121,23],[120.5,22.5],[120,23.5],[120.3,25.2]];
const HAINAN=[[109.2,20],[110.3,20],[110.8,19.3],[110.5,18.3],[109.8,18.2],[109.2,18.8],[109.2,20]];
const SRILANKA=[[80,9.8],[81,9.5],[82,8.2],[81.8,7],[81,6.2],[80,7.5],[79.8,8.5],[80,9.8]];

function isLand(lo,la){
    if(pip(lo,la,ASIA)) return true;
    if(pip(lo,la,JAPAN_H)) return true;
    if(pip(lo,la,JAPAN_K)) return true;
    if(pip(lo,la,JAPAN_Y)) return true;
    if(pip(lo,la,JAPAN_S)) return true;
    if(pip(lo,la,TAIWAN)) return true;
    if(pip(lo,la,HAINAN)) return true;
    if(pip(lo,la,SRILANKA)) return true;
    if(lo>=142&&lo<=144.5&&la>=46&&la<=54&&Math.abs(lo-143)<1.2) return true;  // Sakhalin
    if(dist2(lo,la,114,1)<4.5) return true;   // Borneo
    if(lo>=117&&lo<=127&&la>=5&&la<=19){       // Philippines
        if(dist2(lo,la,121,15.5)<3) return true;
        if(dist2(lo,la,125,8)<2.5) return true;
        if(dist2(lo,la,123,11)<2) return true;
    }
    return false;
}

/* ═══════════════ TERRAIN FEATURES ═══════════════ */

/* --- helpers --- */
function plateau(lo,la,cx,cy,rx,ry,elev,e0=1.35,e1=0.5){
    const dx=(lo-cx)/rx, dy=(la-cy)/ry, d=Math.sqrt(dx*dx+dy*dy);
    return d>e0+0.2?0:ss(e0,e1,d)*elev;
}
function ridge(lo,la,pts,peak,w){
    const d=dPoly(lo,la,pts);
    return d>w*4?0:gauss(d,w)*peak;
}

/* --- Plateaus --- */
const tibetP  = (o,a) => plateau(o,a, 86,33, 14,6, 4500);
const imongP  = (o,a) => plateau(o,a, 112,44, 10,4, 1200);
const loessP  = (o,a) => plateau(o,a, 108,37, 5,3, 1400);
const yngzP   = (o,a) => plateau(o,a, 103,25, 6,3.5, 1900);
const mongP   = (o,a) => plateau(o,a, 105,48, 12,5.5, 1300);
const deccP   = (o,a) => plateau(o,a, 77,15, 5,6, 650);
const cAsiaP  = (o,a) => plateau(o,a, 68,38, 8,5, 2200);
const irPlat  = (o,a) => plateau(o,a, 60,32, 5,5, 1200);

/* --- Mountain Ranges --- */
const _him = [[73,35],[75,32.5],[78,30.5],[81,29],[84,28.2],[87,27.8],[90,27.8],[93,28],[96,28.5],[98,28.5]];
const _kara= [[74,36.2],[76,36.5],[77,36.5]];
const _kunl= [[74,37],[78,36.5],[82,36.2],[86,36.5],[90,37],[94,36.5],[98,36],[101,35.5]];
const _tian= [[67,41.5],[72,42.2],[76,42.5],[80,42.2],[84,42.8],[87,43.5],[90,43.2]];
const _alta= [[84,49],[86,48.5],[88.5,48],[91,47.5]];
const _qinl= [[104,34],[107,34],[110,33.8],[113,34.2]];
const _gkhg= [[119.5,43.5],[120.5,45.5],[121.5,47.5],[122.5,49.5],[123.5,51.5]];
const _lkhg= [[127,47],[128.5,48.5],[130,50]];
const _taih= [[113.5,35.5],[114,37],[114.5,39],[115,40.5]];
const _heng= [[98,25.5],[99,27.5],[99.5,29.5],[100,31.5],[100.5,33]];
const _nanl= [[110,24.8],[112,25.2],[114,25],[116,24.5]];
const _chbai=[[127.5,41.5],[128.5,42.5],[129.5,43.2]];
const _wghat=[[73.5,20],[74,17],[75,14.5],[76,11.5],[77,9]];
const _hkush=[[66,35.5],[68,36.2],[71,36.5]];
const _jpMt= [[131,33],[133,34.5],[135.5,35.5],[138,36.5],[140,38],[140.5,40]];
const _twMt= [[121,22.8],[121,24],[121,25.3]];

const himR  = (o,a)=>ridge(o,a,_him,5800,1.0);
const karaR = (o,a)=>ridge(o,a,_kara,3800,0.8);
const kunlR = (o,a)=>ridge(o,a,_kunl,2800,1.4);
const tianR = (o,a)=>ridge(o,a,_tian,3200,1.3);
const altaR = (o,a)=>ridge(o,a,_alta,2200,1.1);
const qinlR = (o,a)=>ridge(o,a,_qinl,2200,0.9);
const gkhgR = (o,a)=>ridge(o,a,_gkhg,1000,1.1);
const lkhgR = (o,a)=>ridge(o,a,_lkhg,800,0.9);
const taihR = (o,a)=>ridge(o,a,_taih,1300,0.8);
const hengR = (o,a)=>ridge(o,a,_heng,3200,1.1);
const nanlR = (o,a)=>ridge(o,a,_nanl,1000,0.7);
const chbaiR= (o,a)=>ridge(o,a,_chbai,1200,0.9);
const wghatR= (o,a)=>ridge(o,a,_wghat,1000,0.7);
const hkushR= (o,a)=>ridge(o,a,_hkush,3200,1.0);
const jpMtR = (o,a)=>ridge(o,a,_jpMt,1500,0.5);
const twMtR = (o,a)=>ridge(o,a,_twMt,1600,0.3);

/* --- Basins (negative) --- */
function basin(lo,la,cx,cy,rx,ry,depth){
    const dx=(lo-cx)/rx,dy=(la-cy)/ry,d=Math.sqrt(dx*dx+dy*dy);
    return d>1.2?0:-ss(1.1,0.25,d)*depth;
}
const tarimB = (o,a)=>basin(o,a,82,39.5,7,3,3000);
const jungrB = (o,a)=>basin(o,a,85.5,45,5.5,2.5,1000);
const sichB  = (o,a)=>basin(o,a,105.5,30,3.5,2.5,1100);
const turpnB = (o,a)=>{const d=dist2(o,a,89,42.8);return d>2?0:-gauss(d,0.7)*600;};
const qaidB  = (o,a)=>basin(o,a,95,37,3,1.5,400);

/* Gobi/desert lowering in Mongolia/Inner Mongolia */
function gobiDesert(lo,la){
    const d=dist2(lo,la,108,43);
    return d>8?0:-gauss(d,4)*300;
}

/* Southeast coastal hills */
function seCoastalHills(lo,la){
    if(lo<110||lo>122||la<22||la>30) return 0;
    return fbm(lo*0.8+30,la*0.8+40,3)*350;
}

/* ═══════════════ TERRAIN TYPE DETECTION ═══════════════ */
/* Returns 0-1 blend factors for special terrain types */
function getTaklDesert(lo,la){
    /* Taklamakan Desert: center of Tarim Basin */
    const cx=82,cy=39,rx=5.5,ry=2;
    const dx=(lo-cx)/rx,dy=(la-cy)/ry,d=Math.sqrt(dx*dx+dy*dy);
    return d>1?0:ss(1,0.3,d);
}
function getGobiDesert(lo,la){
    /* Gobi Desert: Mongolia-Inner Mongolia border region */
    const d1=dist2(lo,la,105,44); // western gobi
    const d2=dist2(lo,la,112,43); // eastern gobi
    return Math.max(d1<8?gauss(d1,5):0, d2<6?gauss(d2,4):0)*0.7;
}
function getLoessPlatType(lo,la){
    /* Loess Plateau special yellow-brown */
    const cx=108,cy=37,rx=5,ry=2.5;
    const dx=(lo-cx)/rx,dy=(la-cy)/ry,d=Math.sqrt(dx*dx+dy*dy);
    return d>1.2?0:ss(1.1,0.4,d);
}
function getSichuanBasinType(lo,la){
    /* Sichuan "Purple Basin" */
    const cx=105.5,cy=30,rx=3,ry=2;
    const dx=(lo-cx)/rx,dy=(la-cy)/ry,d=Math.sqrt(dx*dx+dy*dy);
    return d>1?0:ss(1,0.3,d);
}
function getTropicalType(lo,la){
    /* Tropical forests: Southeast Asia, southern China */
    if(la>25||la<5) return 0;
    if(lo<92||lo>115) return 0;
    return ss(25,18,la)*0.6;
}

/* Major rivers as subtle blue-green lines */
const RIVERS={
    yangtze:[[91,33],[95,32],[99,29],[102,28.5],[104,29],[106,30],[107,30.5],[109,31],[111,30.5],[113,30],[115,30.5],[117,31],[119,31.5],[121,31.5]],
    yellow:[[96,35],[98,36],[100,37.5],[103,36],[104,37],[106,37.5],[108,38],[110,38],[111,36],[113,35],[115,35.5],[117,36],[119,35]],
    mekong:[[96,32],[98,28],[99,25],[100,22],[101,18],[103,14],[105,10.5]],
    ganges:[[79,30.5],[81,28],[83,27],[85,26],[87,25],[89,24],[90,23]],
    indus:[[76,35],[73,33],[71,30],[69,27],[67,25]],
    amur:[[120,49],[123,50],[127,49],[130,48.5],[133,48],[135,47]],
    pearl:[[106,24],[108,23.5],[110,23],[112,22.5],[113,22.5]],
};
function getRiverFactor(lo,la){
    let minD=99;
    for(const key in RIVERS){
        const d=dPoly(lo,la,RIVERS[key]);
        minD=Math.min(minD,d);
    }
    return minD<0.3?gauss(minD,0.15)*0.5:0;
}

/* ═══════════════ MAIN ELEVATION ═══════════════ */
function getElev(lo,la){
    if(!isLand(lo,la)){
        return -250 - fbm(lo*0.08+5,la*0.08+7,3)*600;
    }
    let e = 80;
    // plateaus
    e += tibetP(lo,la) + imongP(lo,la) + loessP(lo,la) + yngzP(lo,la);
    e += mongP(lo,la) + deccP(lo,la) + cAsiaP(lo,la) + irPlat(lo,la);
    // mountains
    e += himR(lo,la) + karaR(lo,la) + kunlR(lo,la) + tianR(lo,la) + altaR(lo,la);
    e += qinlR(lo,la) + gkhgR(lo,la) + lkhgR(lo,la) + taihR(lo,la) + hengR(lo,la);
    e += nanlR(lo,la) + chbaiR(lo,la) + wghatR(lo,la) + hkushR(lo,la);
    e += jpMtR(lo,la) + twMtR(lo,la) + wuyiR(lo,la) + pamrR(lo,la);
    e += yinshanR(lo,la) + qilianR(lo,la);
    // basins
    e += tarimB(lo,la) + jungrB(lo,la) + sichB(lo,la) + turpnB(lo,la) + qaidB(lo,la);
    // plains
    e += nePlain(lo,la) + ncPlain(lo,la) + gangPl(lo,la);
    e += yzPlain(lo,la) + prPlain(lo,la);
    // additional features
    e += gobiDesert(lo,la) + seCoastalHills(lo,la);
    // multi-octave noise: much more detail at high elevations (match reference sharp ridges)
    const baseE = e;
    e += (fbm(lo*0.2+10,la*0.2+20,4)-0.5)*450;
    e += (fbm(lo*0.6+50,la*0.6+60,3)-0.5)*250;
    // High-frequency detail noise: much stronger at high elevation for ridge/valley texture
    const hfAmp = baseE > 2000 ? 450 + (baseE-2000)*0.15 : baseE > 500 ? 150 : 40;
    e += (fbm(lo*1.5+100,la*1.5+200,3)-0.5)*hfAmp;
    e += (fbm(lo*3.5+77,la*3.5+133,2)-0.5)*(hfAmp*0.5);
    // Extra sharp ridgeline detail for mountain ranges
    if(baseE > 3000){
        const ridgeN = fbm(lo*5+200,la*5+300,2);
        e += (ridgeN > 0.55 ? (ridgeN-0.55)*1200 : ridgeN < 0.45 ? (ridgeN-0.45)*800 : 0);
    }
    return Math.max(e, 2);
}

/* ═══════════════ COLOR SYSTEM ═══════════════ */
/*
 * Matched to reference image style:
 * - Vivid bright greens for lowlands
 * - Light cyan/blue ocean
 * - Warm tan/brown for mid-to-high elevations
 * - Dark chocolate brown for plateau surface & ridges
 * - Yellow-green transition zone
 */
const CS = [
    [-1500,.55,.78,.88], [-600,.60,.82,.90], [-200,.65,.85,.92], [-30,.70,.88,.94],
    [0,.15,.52,.15],  [50,.20,.58,.18], [100,.28,.64,.22], [200,.38,.70,.25],
    [450,.50,.68,.25], [600,.58,.65,.26], [800,.64,.62,.26],
    [1200,.70,.60,.28], [1600,.72,.56,.28],
    [2000,.70,.55,.30], [2800,.65,.48,.28],
    [3500,.58,.42,.26], [4200,.52,.38,.25],
    [5000,.50,.36,.24], [5800,.58,.52,.46],
    [6500,.72,.68,.62], [7500,.88,.86,.84], [9000,.98,.98,.97]
];

/* Special terrain type colors */
const C_DESERT_SAND = [.82,.74,.52];
const C_GOBI        = [.65,.58,.42];
const C_LOESS       = [.70,.58,.34];
const C_SICHUAN     = [.50,.42,.36];
const C_TROPICAL    = [.15,.50,.18];
const C_RIVER       = [.30,.55,.68];

function interpolateCS(el){
    for(let i=0;i<CS.length-1;i++){
        if(el<=CS[i+1][0]){
            const t=clamp((el-CS[i][0])/(CS[i+1][0]-CS[i][0]),0,1);
            return [lerp(CS[i][1],CS[i+1][1],t),lerp(CS[i][2],CS[i+1][2],t),lerp(CS[i][3],CS[i+1][3],t)];
        }
    }
    return [.98,.98,.97];
}

function elevColor(el,lo,la){
    let [r,g,b] = interpolateCS(el);

    /* terrain type overlays */
    const takl=getTaklDesert(lo,la);
    if(takl>0){ r=lerp(r,C_DESERT_SAND[0],takl*.8); g=lerp(g,C_DESERT_SAND[1],takl*.8); b=lerp(b,C_DESERT_SAND[2],takl*.8); }
    const gobi=getGobiDesert(lo,la);
    if(gobi>0){ r=lerp(r,C_GOBI[0],gobi*.65); g=lerp(g,C_GOBI[1],gobi*.65); b=lerp(b,C_GOBI[2],gobi*.65); }
    const loess=getLoessPlatType(lo,la);
    if(loess>0){ r=lerp(r,C_LOESS[0],loess*.6); g=lerp(g,C_LOESS[1],loess*.6); b=lerp(b,C_LOESS[2],loess*.6); }
    const sich=getSichuanBasinType(lo,la);
    if(sich>0){ r=lerp(r,C_SICHUAN[0],sich*.5); g=lerp(g,C_SICHUAN[1],sich*.5); b=lerp(b,C_SICHUAN[2],sich*.5); }
    const trop=getTropicalType(lo,la);
    if(trop>0&&el>0&&el<500){ r=lerp(r,C_TROPICAL[0],trop*.4); g=lerp(g,C_TROPICAL[1],trop*.4); b=lerp(b,C_TROPICAL[2],trop*.4); }
    const river=getRiverFactor(lo,la);
    if(river>0&&el>0){ r=lerp(r,C_RIVER[0],river); g=lerp(g,C_RIVER[1],river); b=lerp(b,C_RIVER[2],river); }

    /* Color noise for surface texture (stronger at higher elevations) */
    const texAmp = el>500 ? 0.08+clamp((el-500)/5000,0,0.1) : 0.03;
    const cn=(fbm(lo*3+300,la*3+400,2)-0.5)*texAmp;
    r=clamp(r+cn,0,1); g=clamp(g+cn*0.8,0,1); b=clamp(b+cn*0.6,0,1);

    return new THREE.Color(r,g,b);
}

/* ═══════════════ GENERATE TERRAIN ═══════════════ */
const bar=document.getElementById('bar'), msg=document.getElementById('load-msg');

async function buildTerrain(){
    msg.textContent='生成地形高程数据...'; bar.style.width='5%';
    await tick();
    const geo=new THREE.PlaneGeometry(TW,TH,GW,GH);
    geo.rotateX(-Math.PI/2);
    const pos=geo.attributes.position.array;
    const vc=pos.length/3;
    const colors=new Float32Array(pos.length);
    const elevArr=new Float32Array(vc);
    const batch=Math.floor(vc/20);

    for(let i=0;i<vc;i++){
        const x=pos[i*3], z=pos[i*3+2];
        const [lo,la]=w2g(x,z);
        const el=getElev(lo,la);
        elevArr[i]=el;
        pos[i*3+1]=el*ES;
        const c=elevColor(el,lo,la);
        colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
        if(i%batch===0){
            bar.style.width=(5+(i/vc)*75)+'%';
            await tick();
        }
    }
    geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
    geo.computeVertexNormals();
    msg.textContent='创建网格与海洋...'; bar.style.width='82%'; await tick();

    const mat=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.receiveShadow=true;
    scene.add(mesh);

    /* water surface */
    const wGeo=new THREE.PlaneGeometry(TW+30,TH+30,64,48);
    wGeo.rotateX(-Math.PI/2);
    const wMat=new THREE.MeshPhongMaterial({
        color:0x8ec8e0, transparent:true, opacity:0.72,
        shininess:60, specular:0x88bbcc,
        side:THREE.DoubleSide
    });
    const water=new THREE.Mesh(wGeo,wMat);
    water.position.y=-0.02;
    scene.add(water);

    /* Edge boundary frame */
    const edgePts=[
        new THREE.Vector3(-TW/2,0.01,-TH/2),new THREE.Vector3(TW/2,0.01,-TH/2),
        new THREE.Vector3(TW/2,0.01,TH/2),new THREE.Vector3(-TW/2,0.01,TH/2),
        new THREE.Vector3(-TW/2,0.01,-TH/2)
    ];
    const edgeGeo=new THREE.BufferGeometry().setFromPoints(edgePts);
    scene.add(new THREE.Line(edgeGeo,new THREE.LineBasicMaterial({color:0x1a3a5a,transparent:true,opacity:0.3})));

    /* grid lines (subtle) */
    addGridLines();
    /* terrain step boundary hints */
    addStepLines();
    /* major rivers */
    addRivers();

    msg.textContent='添加标注...'; bar.style.width='92%'; await tick();
    addLabels();

    bar.style.width='100%'; msg.textContent='完成';
    await new Promise(r=>setTimeout(r,400));
    document.getElementById('loading').classList.add('done');

    return {mesh,elevArr,water};
}

function tick(){ return new Promise(r=>setTimeout(r,0)); }

/* ═══════════════ GRID LINES ═══════════════ */
function addGridLines(){
    const mat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.04});
    // longitude lines every 10°
    for(let lo=60;lo<=150;lo+=10){
        const pts=[];
        for(let la=LA0;la<=LA1;la+=0.5){
            const [x,z]=g2w(lo,la);
            pts.push(new THREE.Vector3(x,0.05,z));
        }
        const g=new THREE.BufferGeometry().setFromPoints(pts);
        scene.add(new THREE.Line(g,mat));
    }
    // latitude lines every 10°
    for(let la=0;la<=60;la+=10){
        const pts=[];
        for(let lo=LO0;lo<=LO1;lo+=0.5){
            const [x,z]=g2w(lo,la);
            pts.push(new THREE.Vector3(x,0.05,z));
        }
        const g=new THREE.BufferGeometry().setFromPoints(pts);
        scene.add(new THREE.Line(g,mat));
    }
}

/* ═══════════════ RIVERS ═══════════════ */
function addRivers(){
    const rMat=new THREE.LineBasicMaterial({color:0x2277bb,transparent:true,opacity:0.35,linewidth:1});
    for(const key in RIVERS){
        const pts=RIVERS[key].map(([lo,la])=>{
            const [x,z]=g2w(lo,la);
            const el=getElev(lo,la);
            return new THREE.Vector3(x,Math.max(el*ES+0.08,0.08),z);
        });
        const geo=new THREE.BufferGeometry().setFromPoints(pts);
        scene.add(new THREE.Line(geo,rMat));
    }
}

/* ═══════════════ STEP BOUNDARY LINES ═══════════════ */
function addStepLines(){
    /* First step boundary (Tibetan Plateau edge): Kunlun-Qilian-Hengduan */
    const step1=[[73,35],[78,31],[83,29],[88,28],[93,28.5],[97,29],[100,31],[101,33],[100,35],[98,36.5],[95,37],[90,37.5],[86,37],[82,36.5],[78,37],[74,37]];
    const step1Mat=new THREE.LineBasicMaterial({color:0xff6600,transparent:true,opacity:0.12});
    const step1Pts=step1.map(([lo,la])=>{
        const [x,z]=g2w(lo,la); const el=getElev(lo,la);
        return new THREE.Vector3(x,el*ES+0.15,z);
    });
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(step1Pts),step1Mat));

    /* Second step boundary: Greater Khingan-Taihang-Wushan-Xuefeng */
    const step2=[[119,51],[120,48],[120,45],[117,42],[115,40],[114,38],[113,36],[112,34],[110,32],[108,30],[106,28],[105,26]];
    const step2Mat=new THREE.LineBasicMaterial({color:0x44aa44,transparent:true,opacity:0.12});
    const step2Pts=step2.map(([lo,la])=>{
        const [x,z]=g2w(lo,la); const el=getElev(lo,la);
        return new THREE.Vector3(x,el*ES+0.15,z);
    });
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(step2Pts),step2Mat));
}

/* ═══════════════ LABELS ═══════════════ */
function mkLabel(txt,lo,la,elev,cls=''){
    const d=document.createElement('div');
    d.className='tlabel '+cls;
    d.textContent=txt;
    const lb=new CSS2DObject(d);
    const [x,z]=g2w(lo,la);
    lb.position.set(x,Math.max(elev*ES+0.6,0.6),z);
    scene.add(lb);
    /* big/country labels visible from far, detail labels need zoom */
    const isBig=cls.includes('big')||cls.includes('country')||cls.includes('sea');
    const isDetail=cls.includes('river')||cls.includes('desert');
    allLabels.push({obj:lb, minDist:isBig?10:isDetail?8:8, maxDist:isBig?120:isDetail?70:80});
    return lb;
}

    mkLabel('渤  海',119.5,38.8,0,'sea');
    mkLabel('孟加拉湾',87,12,0,'sea');
    mkLabel('阿拉伯海',66,16,0,'sea');
    mkLabel('印 度 洋',80,3,0,'sea');
    mkLabel('鄂霍次克海',148,52,0,'sea');
}

/* ═══════════════ RAYCASTER / TOOLTIP ═══════════════ */
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
const tooltip=document.getElementById('tooltip');
const cursorRow=document.getElementById('cursor-row');
const cursorVal=document.getElementById('cursor-val');
let terrainMesh=null, elevData=null;

renderer.domElement.addEventListener('mousemove',e=>{
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;
    if(!terrainMesh) return;
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObject(terrainMesh);
    if(hits.length){
        const p=hits[0].point;
        const [lo,la]=w2g(p.x,p.z);
        const el=p.y/ES;
        tooltip.style.display='block';
        tooltip.style.left=(e.clientX+14)+'px';
        tooltip.style.top=(e.clientY+14)+'px';
        tooltip.textContent=`${lo.toFixed(1)}°E, ${la.toFixed(1)}°N | 海拔 ${Math.round(el)}m`;
        cursorRow.style.display='flex';
        cursorVal.textContent=`${lo.toFixed(1)}°E ${la.toFixed(1)}°N  ${Math.round(el)}m`;
    } else {
        tooltip.style.display='none';
        cursorRow.style.display='none';
    }
});
renderer.domElement.addEventListener('mouseleave',()=>{
    tooltip.style.display='none';
    cursorRow.style.display='none';
});

/* ═══════════════ RESIZE ═══════════════ */
window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    labelR.setSize(innerWidth,innerHeight);
});

/* ═══════════════ LABEL DISTANCE MANAGEMENT ═══════════════ */
const allLabels=[];
function updateLabelVisibility(){
    const camPos=camera.position;
    const dist=camPos.length();
    allLabels.forEach(({obj,minDist,maxDist})=>{
        const d=camPos.distanceTo(obj.position);
        const el=obj.element;
        if(dist<minDist||dist>maxDist){
            el.style.opacity='0';
        } else {
            const fadeIn=ss(minDist,minDist+5,dist);
            const fadeOut=ss(maxDist,maxDist-10,dist);
            el.style.opacity=String(Math.min(fadeIn,fadeOut));
        }
    });
}

/* ═══════════════ ANIMATE ═══════════════ */
let waterRef=null;
let frameCount=0;
function animate(t=0){
    requestAnimationFrame(animate);
    ctrl.update();
    frameCount++;
    /* gentle water animation */
    if(waterRef){
        const wp=waterRef.geometry.attributes.position.array;
        const wc=wp.length/3;
        for(let i=0;i<wc;i++){
            wp[i*3+1]=Math.sin(t*0.0008+wp[i*3]*0.15)*0.03+Math.cos(t*0.0006+wp[i*3+2]*0.12)*0.02-0.02;
        }
        waterRef.geometry.attributes.position.needsUpdate=true;
    }
    /* update label visibility every 10 frames */
    if(frameCount%10===0) updateLabelVisibility();
    renderer.render(scene,camera);
    labelR.render(scene,camera);
}

/* ═══════════════ INIT ═══════════════ */
buildTerrain().then(res=>{
    terrainMesh=res.mesh;
    elevData=res.elevArr;
    waterRef=res.water;
    animate();
});

</script>
